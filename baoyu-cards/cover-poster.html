<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1240px; height:1656px; overflow:hidden; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  /* ===== 封面B: poster / screen-print 风格 ===== */
  .cover-b {
    width:1240px; height:1656px; background:#F5E6D0; position:relative; overflow:hidden;
  }
  /* 半调网点纹理 (浅色) */
  .halftone {
    position:absolute; top:0; left:0; width:1240px; height:1656px;
    background-image: radial-gradient(circle, rgba(232,117,26,0.10) 2px, transparent 2.5px);
    background-size: 14px 14px; z-index:1;
  }
  /* 大圆弧几何 */
  .arc { position:absolute; width:900px; height:900px; border-radius:50%; }
  .arc1 { background:#E8751A; top:-260px; right:-220px; }
  .arc2 { border: 14px solid #0A6E6E; bottom:-200px; left:-240px; width:760px; height:760px; background:transparent; }
  .title1 { font-size:92px; font-weight:900; color:#0A6E6E; text-align:center; letter-spacing:4px; }
  .big {
    font-size:200px; font-weight:900; color:#0A6E6E; text-align:center; line-height:1.02;
    text-shadow: 5px 5px 0 #F5E6D0, 9px 9px 0 rgba(0,0,0,0.18);
  }
  .sub2 { font-size:66px; font-weight:700; color:#C0392B; text-align:center; margin-top:30px; }
  .box {
    position:absolute; top:0; left:0; width:1240px; height:1656px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:5;
  }
  /* 复古边框 */
  .frame { position:absolute; top:36px; left:36px; right:36px; bottom:36px;
           border:3px solid #0A6E6E; z-index:2; }
  .frame2 { position:absolute; top:48px; left:48px; right:48px; bottom:48px;
            border:1px solid #E8751A; z-index:2; }
</style>
</head>
<body>
  <div class="cover-b">
    <div class="halftone"></div>
    <div class="frame"></div><div class="frame2"></div>
    <div class="arc arc1"></div><div class="arc arc2"></div>
    <div class="box">
      <div class="title1">小米全屋智能</div>
      <div style="height:40px"></div>
      <div class="big">值不值?</div>
      <div class="sub2">装完 1 年的真实账</div>
    </div>
  </div>
</body>
</html>
