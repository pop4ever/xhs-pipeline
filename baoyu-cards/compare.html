<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1240px; height:1656px; overflow:hidden; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:#000; }
  /* ===== 03 对比: bold 风格黑底红黄高冲击 ===== */
  .card {
    width:1240px; height:1656px; background:#000; padding:70px 60px; color:#fff;
  }
  .title {
    text-align:center; font-size:76px; font-weight:900; margin-bottom:60px;
    text-shadow: 4px 4px 0 #E53E3E;
  }
  .cols { display:flex; gap:40px; }
  .col { flex:1; border-radius:24px; padding:60px 40px; }
  .yes { background:#1A3A2E; border:4px solid #48BB78; }
  .no  { background:#3A1515; border:4px solid #E53E3E; }
  .chead { font-size:64px; font-weight:900; text-align:center; margin-bottom:50px; }
  .yes .chead { color:#48BB78; }
  .no .chead { color:#F56565; }
  .item {
    font-size:38px; line-height:1.5; margin-bottom:30px; font-weight:600;
    display:flex; align-items:flex-start; gap:16px;
  }
  .dot { font-size:40px; flex-shrink:0; }
  .concl {
    position:absolute; bottom:60px; left:60px; right:60px; text-align:center;
    background:#F6E05E; color:#000; font-size:52px; font-weight:900;
    border-radius:20px; padding:26px 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">看完再决定 💥</div>
    <div class="cols">
      <div class="col yes">
        <div class="chead">✅ 适合</div>
        <div class="item"><span class="dot">①</span>新装修 水电阶段</div>
        <div class="item"><span class="dot">②</span>爱远程控制 在外控家</div>
        <div class="item"><span class="dot">③</span>家有老人小孩 安防联动</div>
        <div class="item"><span class="dot">④</span>想低成本升级体验</div>
      </div>
      <div class="col no">
        <div class="chead">❌ 不适合</div>
        <div class="item"><span class="dot">①</span>已装完 不想拆墙</div>
        <div class="item"><span class="dot">②</span>预算吃紧 先基础档</div>
        <div class="item"><span class="dot">③</span>图新鲜 没实际需求</div>
        <div class="item"><span class="dot">④</span>不联网就焦虑</div>
      </div>
    </div>
    <div class="concl">先想清需求,再决定花多少 💰</div>
  </div>
</body>
</html>
